name: Pedometer output comparison preparation
on:
  push:
    branches: [compare-pedometer-outputs-20260930]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      COMPARISON_OUTPUT: ${{ runner.temp }}/pedometer-comparison
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Record source and install converter dependencies
        run: |
          mkdir -p "$COMPARISON_OUTPUT"
          git rev-parse HEAD | tee "$COMPARISON_OUTPUT/execution-revision.txt"
          git diff --name-only 007eb0475681b0088efa19e845b3807ab1b1ec27 HEAD | tee "$COMPARISON_OUTPUT/changed-paths.txt"
          test -z "$(git diff 007eb0475681b0088efa19e845b3807ab1b1ec27 HEAD -- lib examples tests package.json bunfig.toml)"
          bun install 2>&1 | tee "$COMPARISON_OUTPUT/dependency-install.log"
      - name: Execute unchanged converter and compare explicit source settings
        run: bun scripts/prepare-pedometer-comparison.ts 2>&1 | tee "$COMPARISON_OUTPUT/conversion.log"
      - name: Run existing software tests
        run: bun test 2>&1 | tee "$COMPARISON_OUTPUT/unit-tests.log"
      - name: Retrieve exact TI license manifest without accepting or installing
        run: |
          url=https://dr-download.ti.com/software-development/ide-configuration-compiler-or-debugger/MD-nsUM6f7Vvb/1.26.3.4558/SysConfig_Core_Tool_1.26.3_manifest.html
          if curl --fail --location --retry 2 --connect-timeout 20 --max-time 90 "$url" -o "$COMPARISON_OUTPUT/SysConfig_Core_Tool_1.26.3_manifest.html"; then
            sha256sum "$COMPARISON_OUTPUT/SysConfig_Core_Tool_1.26.3_manifest.html" > "$COMPARISON_OUTPUT/license-manifest.sha256"
          else
            printf 'Exact manifest download failed; no TI installation or license acceptance occurred.\n' > "$COMPARISON_OUTPUT/license-manifest-download-failed.txt"
          fi
      - name: Upload actual converter output and comparison inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pedometer-comparison-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/pedometer-comparison/
          retention-days: 14
          if-no-files-found: error
