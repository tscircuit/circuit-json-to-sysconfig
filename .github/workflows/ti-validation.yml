name: TI SysConfig validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ti-validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure TI paths and evidence directory
        run: |
          mkdir -p "$RUNNER_TEMP/ti-validation/runs"
          {
            printf 'TI_SYSCONFIG_NODE=%s/sysconfig_1.14.0/nodejs/node\n' "$RUNNER_TEMP"
            printf 'TI_SYSCONFIG_CLI=%s/sysconfig_1.14.0/dist/cli.js\n' "$RUNNER_TEMP"
            printf 'TI_SDK_ROOT=%s/mcupsdk-core\n' "$RUNNER_TEMP"
            printf 'TI_VALIDATION_ARTIFACTS=%s/ti-validation\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install package dependencies
        run: bun install 2>&1 | tee "$TI_VALIDATION_ARTIFACTS/bun-install.log"
      - name: Install pinned TI SysConfig
        run: |
          exec > >(tee "$TI_VALIDATION_ARTIFACTS/sysconfig-setup.log") 2>&1
          installer="$RUNNER_TEMP/sysconfig-1.14.0_2667-setup.run"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
            --output "$installer" \
            https://software-dl.ti.com/ccs/esd/sysconfig/sysconfig-1.14.0_2667-setup.run
          printf '%s  %s\n' \
            0ff048df222151d34757aae3bec01ee586a85e1641dadeda7b227a7055b501b4 \
            "$installer" | sha256sum --check --strict
          chmod u+x "$installer"
          "$installer" --help
          # Unattended installation accepts TI's license; see README prerequisites.
          "$installer" --mode unattended --prefix "$RUNNER_TEMP/sysconfig_1.14.0"
          test -x "$TI_SYSCONFIG_NODE"
          test "$("$TI_SYSCONFIG_NODE" "$TI_SYSCONFIG_CLI" --version)" = '1.14.0+2667'
      - name: Check out pinned AM243x SDK support
        run: |
          exec > >(tee "$TI_VALIDATION_ARTIFACTS/sdk-setup.log") 2>&1
          sdk_revision=e7e068494bbd5714d6d34c55b10184a5bd84ed30
          git init "$TI_SDK_ROOT"
          git -C "$TI_SDK_ROOT" remote add origin https://github.com/TexasInstruments/mcupsdk-core.git
          git -C "$TI_SDK_ROOT" fetch --depth 1 origin "$sdk_revision"
          git -C "$TI_SDK_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$TI_SDK_ROOT" rev-parse HEAD)" = "$sdk_revision"
          cp "$TI_SDK_ROOT/.metadata/product.json" "$TI_VALIDATION_ARTIFACTS/sdk-product.json"
      - name: Record validation environment
        run: |
          {
            uname -a
            cat /etc/os-release
            git rev-parse HEAD
            bun --version
            "$TI_SYSCONFIG_NODE" --version
            "$TI_SYSCONFIG_NODE" "$TI_SYSCONFIG_CLI" --version
            git -C "$TI_SDK_ROOT" rev-parse HEAD
            sha256sum tests/fixtures/ti-reference/reference.syscfg
            printf 'TI_SYSCONFIG_NODE=%s\nTI_SYSCONFIG_CLI=%s\nTI_SDK_ROOT=%s\n' \
              "$TI_SYSCONFIG_NODE" "$TI_SYSCONFIG_CLI" "$TI_SDK_ROOT"
          } 2>&1 | tee "$TI_VALIDATION_ARTIFACTS/environment.log"
      - name: Validate native, round-trip, A7, and B7 with real TI
        env:
          TMPDIR: ${{ runner.temp }}/ti-validation/runs
        run: bun run validate:ti 2>&1 | tee "$TI_VALIDATION_ARTIFACTS/validation.log"
      - name: Upload TI logs and generated outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ti-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ti-validation/
          retention-days: 14
          if-no-files-found: warn
